name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # No database is needed, the inventory is injected into the endpoint.
      # Prisma still wants the variable present when generating a client.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, format
        run: pnpm validate

      - name: Test
        run: pnpm vitest run
