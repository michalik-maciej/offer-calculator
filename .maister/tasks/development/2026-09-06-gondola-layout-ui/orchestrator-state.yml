task:
  title: Gondola layout support in the offer configurator UI
  description: >-
    Add gondola layout support to the offer configurator UI. The domain already
    calculates gondola demand (calculateGondolaLayoutDemand, with tests), the Valibot
    contract exists (packages/schemas/src/LayoutGondola.schema.ts) and
    buildLayoutDescription already produces Polish descriptions for gondolas, but
    nothing under packages/apps/web references gondolas at all: a user cannot add one.
    Needed: choosing the run type when adding a run, the gondola dimension form, plan
    rendering and pricing for it. All user-facing text in Polish.
  status: in_progress
  tags: [frontend, gondola, configurator]
  priority: high

