  phase_summaries:
    research: {summary: null, key_findings: [], recommended_approach: null}
    design:
      summary: >-
        Cztery makiety HTML związane z realnym systemem projektowym repo: tokeny shadcn
        z index.css, prymitywy z core/ui, ikony lucide, skala rysunku 1.6 px na cm.
