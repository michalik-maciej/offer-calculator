  task_characteristics_note: >-
    has_reproducible_defect ustawione na false świadomie. Rozjazd w liczeniu nóg
    odtwarza się jedną komendą w calculateGondolaLayoutDemand.test.ts, ale żaden
    użytkownik nie może go wywołać, żadna zapisana oferta nie zawiera gondoli, a
    test w repo utrwala dzisiejsze zachowanie celowo. Decyzja o dzieleniu nóg
    definiuje więc, ile gondola kosztuje, a nie przywraca utracone zachowanie.

