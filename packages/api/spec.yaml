openapi: 3.0.3

info:
  title: Offer Calculator API
  description: API for calculating Bill of Materials (BOM) for modular shelving systems
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.example.com
    description: Production

tags:
  - name: Calculation
  - name: Projects
  - name: Catalog

paths:
  /api/calculate/linear-wall:
    post:
      tags: [Calculation]
      summary: Calculate BOM for linear wall shelving layout
      operationId: calculateLinearWall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutLinearWall"
      responses:
        "200":
          description: BOM calculated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BomResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects:
    post:
      tags: [Projects]
      summary: Create a project and persist BOM
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/bom:
    get:
      tags: [Projects]
      summary: Get BOM for a project
      operationId: getProjectBom
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: BOM retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BomResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/catalog/components:
    get:
      tags: [Catalog]
      summary: Get catalog components
      operationId: getCatalogComponents
      responses:
        "200":
          description: Catalog returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogComponent"

components:
  schemas:
    # --------------------
    # Layout input
    # --------------------
    LayoutLinearWall:
      type: object
      required: [height, quantity, shelfUnits]
      properties:
        id:
          type: string
          format: uuid
        height:
          type: number
        depth:
          type: number
          nullable: true
        quantity:
          type: number
        shelfUnits:
          type: array
          items:
            $ref: "#/components/schemas/ShelfUnit"

    ShelfUnit:
      type: object
      required: [quantity, shelves]
      properties:
        id:
          type: string
          format: uuid
        width:
          type: number
          nullable: true
        quantity:
          type: number
        shelves:
          type: array
          items:
            $ref: "#/components/schemas/Shelf"

    Shelf:
      type: object
      required: [quantity]
      properties:
        id:
          type: string
          format: uuid
        depth:
          type: number
          nullable: true
        quantity:
          type: number

    # --------------------
    # BOM
    # --------------------
    BomItem:
      type: object
      required: [id, quantity]
      properties:
        id:
          type: string
        quantity:
          type: number

    BomResponse:
      type: object
      required: [bom]
      properties:
        bom:
          type: array
          items:
            $ref: "#/components/schemas/BomItem"

    # --------------------
    # Projects
    # --------------------
    CreateProjectRequest:
      type: object
      required: [name, layoutType, layout]
      properties:
        name:
          type: string
        layoutType:
          type: string
          enum: [LINEAR_WALL]
        layout:
          $ref: "#/components/schemas/LayoutLinearWall"

    ProjectResponse:
      type: object
      required: [projectId, bom, createdAt]
      properties:
        projectId:
          type: string
          format: uuid
        bom:
          type: array
          items:
            $ref: "#/components/schemas/BomItem"
        createdAt:
          type: string
          format: date-time

    # --------------------
    # Catalog
    # --------------------
    CatalogComponent:
      type: object
      required: [id, category, price]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [back, baseCover, foot, leg, misc, shelf, support]
        width:
          type: number
          nullable: true
        depth:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        label:
          type: string
        price:
          type: number

    # --------------------
    # Errors
    # --------------------
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        details:
          type: string
